<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Undead — شب زامبی‌ها. در قبرستان تاریک تا صبح زنده بمون.">
<title>Undead — شب زامبی‌ها</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Vazirmatn:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="بازی"></canvas>

<button id="btnSound" class="icon-btn" aria-label="صدا">
  <svg class="on" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
  <svg class="off" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm15.6 3 2.2-2.2-1.4-1.4-2.2 2.2-2.2-2.2-1.4 1.4 2.2 2.2-2.2 2.2 1.4 1.4 2.2-2.2 2.2 2.2 1.4-1.4-2.2-2.2z"/></svg>
</button>

<div id="hud" hidden>
  <button id="btnPause" class="icon-btn" aria-label="توقف">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <div class="top">
    <div id="waveLabel">موج ۱</div>
    <div id="score">0</div>
    <div class="hp"><div id="hpFill"></div><span id="hpText">100</span></div>
  </div>
</div>

<div id="banner" hidden><div id="bannerTitle"></div><div id="bannerSub"></div></div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1 class="logo">UNDEAD</h1>
    <p class="tag">شب زامبی‌ها · تا صبح زنده بمون</p>
    <button id="btnStart" class="cta">شروع</button>
    <p class="best-line">رکورد: <b id="menuBest">۰</b></p>
    <ul class="help">
      <li class="touch-only"><span class="k">انگشت را روی صفحه بکش</span>حرکت</li>
      <li class="kbd-only"><span class="k">WASD / ← ↑ → ↓</span>حرکت</li>
      <li>شلیک <b>خودکار</b> است؛ فقط جاخالی بده</li>
      <li>بعد از هر موج سلاحت قوی‌تر می‌شود</li>
    </ul>
    <a class="home" href="../">← همه‌ی بازی‌ها</a>
  </div>
</div>

<div id="pause" class="overlay" hidden>
  <div class="panel">
    <h2>توقف</h2>
    <button id="btnResume" class="cta">ادامه</button>
  </div>
</div>

<div id="over" class="overlay" hidden>
  <div class="panel">
    <h2 class="dead">خورده شدی!</h2>
    <div id="finalScore" class="final">۰</div>
    <p id="newBest" class="badge" hidden>رکورد جدید!</p>
    <div class="stats">
      <div><small>موج</small><b id="finalWave">۰</b></div>
      <div><small>زامبی</small><b id="finalKills">۰</b></div>
      <div><small>رکورد</small><b id="overBest">۰</b></div>
    </div>
    <button id="btnRestart" class="cta">دوباره</button>
    <a class="home" href="../">← همه‌ی بازی‌ها</a>
  </div>
</div>

<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
